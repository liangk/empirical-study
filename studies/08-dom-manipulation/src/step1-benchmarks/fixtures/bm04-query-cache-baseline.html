<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>BM-04 Baseline: DOM Query in Loop</title></head>
<body>
<div id="target">0</div>
<!-- add 200 extra nodes to make DOM traversal non-trivial -->
<script>
const frag = document.createDocumentFragment();
for (let i = 0; i < 200; i++) {
  const d = document.createElement('div');
  d.id = 'node-' + i;
  frag.appendChild(d);
}
document.body.appendChild(frag);
</script>
<script>
window.__runBenchmark = function(n) {
  return new Promise(function(resolve) {
    const longTasks = [];
    const observer = new PerformanceObserver(function(list) {
      list.getEntries().forEach(function(e) { longTasks.push(e.duration); });
    });
    observer.observe({ entryTypes: ['longtask'] });

    let frameCount = 0;
    let rafStart = performance.now();
    function countFrames() {
      frameCount++;
      if (performance.now() - rafStart < 500) requestAnimationFrame(countFrames);
    }
    requestAnimationFrame(countFrames);

    const start = performance.now();
    // BASELINE: getElementById called on every iteration
    for (let i = 0; i < n; i++) {
      const el = document.getElementById('target');
      el.textContent = String(i);
    }
    const durationMs = performance.now() - start;

    setTimeout(function() {
      observer.disconnect();
      const elapsed = performance.now() - rafStart;
      const fps = (frameCount / elapsed) * 1000;
      resolve({ durationMs: durationMs, fps: fps, longTaskCount: longTasks.length });
    }, 600);
  });
};
</script>
</body>
</html>
