<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BM-07 Optimized — DOM Manipulation via DocumentFragment</title>
  <style>
    body { font-family: monospace; padding: 16px; }
    #controls { margin-bottom: 12px; }
    #output { margin-top: 12px; white-space: pre; font-size: 13px; }
    #list { border: 1px solid #ccc; padding: 8px; max-height: 200px; overflow: auto; }
  </style>
</head>
<body>
  <h2>BM-07: DOM Manipulation — OPTIMIZED (DocumentFragment batch)</h2>
  <div id="controls">
    <label>n: <input id="nInput" type="number" value="1000" min="10" max="10000" step="100"></label>
    <label style="margin-left:12px">trials: <input id="trialsInput" type="number" value="5" min="1" max="30"></label>
    <button onclick="runBenchmark()">Run Optimized</button>
  </div>
  <ul id="list"></ul>
  <div id="output">Results will appear here...</div>

  <script>
    function generateItems(n) {
      const items = [];
      let s = 0xbeef07 >>> 0;
      function rand() {
        s += 0x6d2b79f5;
        let t = s;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }
      for (let i = 0; i < n; i++) {
        items.push(`Item ${i + 1} \u2014 ${Math.floor(rand() * 10000)}`);
      }
      return items;
    }

    /**
     * OPTIMIZED: Build all nodes into a DocumentFragment (no layout effect),
     * then commit all changes with a single appendChild — one layout recalculation.
     */
    function runOptimized(items) {
      const list = document.getElementById('list');
      list.innerHTML = '';
      const fragment = document.createDocumentFragment();
      for (let i = 0; i < items.length; i++) {
        const li = document.createElement('li');
        li.textContent = items[i];
        fragment.appendChild(li);
      }
      list.appendChild(fragment);
    }

    async function runBenchmark() {
      const n = parseInt(document.getElementById('nInput').value, 10);
      const trials = parseInt(document.getElementById('trialsInput').value, 10);
      const items = generateItems(n);
      const output = document.getElementById('output');
      output.textContent = `Running ${trials} trials at n=${n}...\n`;

      const times = [];
      for (let t = 0; t < trials; t++) {
        await new Promise(r => setTimeout(r, 50));
        const start = performance.now();
        runOptimized(items);
        const end = performance.now();
        times.push(end - start);
        output.textContent += `  Trial ${t + 1}: ${(end - start).toFixed(3)} ms\n`;
      }

      const mean = times.reduce((a, b) => a + b, 0) / times.length;
      const sorted = [...times].sort((a, b) => a - b);
      const median = sorted[Math.floor(sorted.length / 2)];
      const stddev = Math.sqrt(times.reduce((acc, x) => acc + (x - mean) ** 2, 0) / (times.length - 1));
      const cv = (stddev / mean) * 100;

      output.textContent += `\n--- Summary ---\n`;
      output.textContent += `  n        = ${n}\n`;
      output.textContent += `  trials   = ${trials}\n`;
      output.textContent += `  mean     = ${mean.toFixed(3)} ms\n`;
      output.textContent += `  median   = ${median.toFixed(3)} ms\n`;
      output.textContent += `  stddev   = ${stddev.toFixed(3)} ms\n`;
      output.textContent += `  CV       = ${cv.toFixed(1)}%\n`;
      output.textContent += `\nOpen Performance tab in DevTools and record while clicking Run\nto capture Layout/UpdateLayoutTree trace events.\n`;
    }
  </script>
</body>
</html>
